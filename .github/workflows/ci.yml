name: CI

on:
  push:
    branches: [ main, lab1-structure ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure CMake
        run: cmake -S lab1 -B lab1/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build lab1/build

      - name: Run tests
        run: ./lab1/build/lab1_tests

  build-windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-make

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -G Ninja -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        shell: msys2 {0}
        run: cmake --build lab1/build

      - name: Package artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp lab1/build/lab1_app.exe dist/
          cp lab1/build/lab1_tests.exe dist/
          cd dist && tar -czf ../lab1-windows.zip *

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: lab1-windows.zip
          generate_release_notes: true