name: CI

on:
  push:
    branches: [ main, lab1-structure, feature/lab3-online-learning, feature/lab4 ]
    tags: [ 'v*', 'lab3-v*', 'lab4-v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lab1:
    name: "Lab 1: Tests & Coverage"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab1-structure' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build lcov cppcheck python3-pip
          pip install gcovr

      - name: Configure CMake lab1
        run: |
          cmake -S lab1 -B lab1/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build lab1
        run: cmake --build lab1/build

      - name: Run lab1 tests
        run: ./lab1/build/lab1_tests

      - name: Check coverage lab1 (>= 90% lines)
        working-directory: lab1
        run: |
          gcovr --root . \
                --filter "src/.*" \
                --print-summary \
                --fail-under-line 90

      - name: Run cppcheck lab1
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   -I lab1/include \
                   lab1/src lab1/app

  lab3:
    name: "Lab 3: Tests & Coverage (>= 90%)"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/lab3-online-learning' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/lab3-') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build lcov cppcheck python3-pip
          pip install gcovr

      - name: Configure CMake lab3
        run: |
          cmake -S lab3 -B lab3/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build lab3
        run: cmake --build lab3/build

      - name: Run lab3 tests
        run: ./lab3/build/learning_platform_tests

      - name: Check coverage lab3 (>= 90% lines)
        working-directory: lab3
        run: |
          gcovr --root . \
                --filter "src/.*" \
                --print-summary \
                --fail-under-line 90

      - name: Run cppcheck lab3
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   -I lab3/include \
                   lab3/src lab3/cli

  lab4:
    name: "Lab 4: Tests & Coverage (>= 90%)"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/lab4' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/lab4-') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build lcov cppcheck python3-pip
          pip install gcovr

      - name: Configure CMake lab4
        run: |
          cmake -S lab4 -B lab4/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build lab4
        run: cmake --build lab4/build

      - name: Run lab4 tests
        run: |
          ./lab4/build/sorts_tests
          ./lab4/build/graph_tests

      - name: Check coverage lab4 (>= 90% lines)
        working-directory: lab4
        run: |
          gcovr --root . \
                --filter "include/.*" \
                --filter "src/.*" \
                --print-summary \
                --fail-under-line 90

      - name: Run cppcheck lab4
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=normalCheckLevelMaxBranches \
                   -I lab4/include \
                   lab4/src lab4/cli lab4/include

  release-lab3:
    name: "Release: Lab 3 Windows"
    runs-on: windows-latest
    needs: lab3
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/lab3-') || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake lab3
        shell: msys2 {0}
        run: |
          cmake -S lab3 -B lab3/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build lab3
        shell: msys2 {0}
        run: cmake --build lab3/build

      - name: Package artifact lab3
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp lab3/build/learning_platform_app.exe dist/
          cp lab3/build/learning_platform_tests.exe dist/
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ../lab3-windows.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lab3-windows.zip
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'lab3-v1.0' }}
          name: "Lab 3 — Online Learning Platform"
          body: |
            Автоматический релиз лабораторной работы №3 (Платформа онлайн-обучения).

            В архиве: `learning_platform_app.exe`, `learning_platform_tests.exe` и необходимые библиотеки DLL.
            Запуск: распаковать архив и запустить `learning_platform_app.exe`.

  release-lab4:
    name: "Release: Lab 4 Windows"
    runs-on: windows-latest
    needs: lab4
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/lab4' || startsWith(github.ref, 'refs/tags/lab4-') || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake lab4
        shell: msys2 {0}
        run: |
          cmake -S lab4 -B lab4/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build lab4
        shell: msys2 {0}
        run: cmake --build lab4/build

      - name: Package artifact lab4
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp lab4/build/lab4_app.exe dist/
          cp lab4/build/sorts_tests.exe dist/
          cp lab4/build/graph_tests.exe dist/
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ../lab4-windows.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lab4-windows.zip
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'lab4-v1.0' }}
          name: "Lab 4 — Generic Programming & Containers (Variant 11)"
          body: |
            Автоматический релиз лабораторной работы №4 (Вариант 11).

            В архиве:
            - `lab4_app.exe` (интерактивное консольное CLI-меню)
            - `sorts_tests.exe` (unit-тесты сортировок In-place merge sort и Bogosort)
            - `graph_tests.exe` (unit-тесты контейнера графа на структуре Вирта)
            - Необходимые системные DLL-библиотеки

            Запуск: распаковать архив и запустить `lab4_app.exe`.